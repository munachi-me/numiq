name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v1.0.3)
        required: true
      dry_run:
        description: Rehearse without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read
      packages: write # GitHub Packages, via the ephemeral GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # No registry-url on purpose: it writes an .npmrc containing
      # _authToken=${NODE_AUTH_TOKEN}, which is empty here and can shadow the
      # OIDC exchange. npm defaults to registry.npmjs.org anyway.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11

      # Fails in seconds rather than after the full verify run when the job is
      # missing `id-token: write` or runs on an unsupported runner.
      - name: Preflight - OIDC token is available
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::OIDC unavailable. Needs 'permissions: id-token: write' and a GitHub-hosted runner."
            exit 1
          fi

      - run: npm ci

      - name: Tag must match package.json
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit is not an ancestor of main"
            exit 1
          fi

      - run: npm run verify

      # No token: npm exchanges the OIDC token for short-lived credentials and
      # attaches provenance automatically on GitHub-hosted runners.
      # DRY_RUN goes through env, not inline interpolation: the `inputs` context
      # is only defined for workflow_dispatch, so on a tag push it is undefined.
      - name: Publish to npm
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set +e
          output="$(npm publish ${DRY_RUN} 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          [ "$status" -eq 0 ] && exit 0
          # Reaching the duplicate check proves prepublishOnly ran and the tarball packed.
          # On a dry run that is the whole point of a rehearsal. On a real tag push it means
          # the version is already on the registry, which is not a failure: it happens when a
          # maintainer published locally and then pushed the tag. Failing here would also
          # skip the GitHub Packages step, leaving that registry behind.
          # Only this version counts, so a mismatch still fails loudly.
          version="$(node -p "require('./package.json').version")"
          if printf '%s' "$output" | grep -q "previously published" &&
            printf '%s' "$output" | grep -q "previously published versions: ${version}[^0-9]"; then
            if [ -n "${DRY_RUN}" ]; then
              echo "::notice::Already published. Packing and prepublish verified; a dry run stops before the OIDC exchange."
            else
              echo "::notice::${version} is already on npm. Continuing so GitHub Packages gets it too."
            fi
            exit 0
          fi
          exit "$status"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          npmrc="$(mktemp)"
          chmod 600 "$npmrc"
          {
            echo "@munachi-me:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > "$npmrc"
          set +e
          output="$(npm publish --userconfig "$npmrc" ${DRY_RUN} 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          rm -f "$npmrc"
          [ "$status" -eq 0 ] && exit 0
          if [ -n "${DRY_RUN}" ] && printf '%s' "$output" | grep -q "previously published"; then
            echo "::notice::Already published to GitHub Packages; rehearsal verified packing."
            exit 0
          fi
          exit "$status"
